name: CI

# [7/19 v0.5.4] CI upgrade: lint + matrix + coverage + concurrency cancel.
# Old workflow: only macOS + Python 3.11 + run tests.
# New: 4-stage pipeline (lint → test matrix → security → summary).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR (saves CI minutes on rapid pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Stage 1: Lint ───────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff==0.15.10

      - name: Ruff check
        run: ruff check *.py tests/

      - name: Ruff format check (src only)
        # Skip tests/ — many pre-existing files use a different formatting style
        # (mostly single-quote strings, which ruff would touch). Tests are
        # already covered by `ruff check` for lint issues, and pytest validates
        # correctness. Reformatting 30 test files in one go is a separate refactor.
        run: ruff format --check *.py scripts/*.py

  # ─── Stage 2: Test matrix ───────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    # [8/9 P1 follow-up] 改 macos-13 (x86_64) — macos-latest (arm64) hostedtoolcache Python
    # 编译不带 enable_load_extension (sandbox 限制), Memory() 调 sqlite_vec load 必 fail.
    # macos-13 (x86_64) 用上游 python.org macOS installer build, 默认带 enable_load_extension.
    # Memory() 是 mnelo 应用服务程序代码 (memory.py:298), 主人 8/9 定: "调整测试代码"
    # 不动 memory.py — CI infra 适配应用服务代码现状.
    runs-on: macos-13
    strategy:
      # Don't cancel the whole matrix if one version fails — let all run so
      # the summary shows the full picture.
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-cov ruff==0.15.10

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Key by model name + OS (HF cache is arch-agnostic but be safe)
          key: ${{ runner.os }}-hf-bge-small-zh

      - name: Init test DB
        # [8/9 P1 follow-up] Memory() class 自己初始化 DB (memory.py:298 + run schema.sql),
        # init_db.py 是冗余的; CI 强制 init_db.py 会因 hostedtoolcache Python build 不带
        # enable_load_extension (macOS arm64 sandbox) 而 fail. 让 test 阶段 Memory() 自建库.
        run: |
          mkdir -p ~/.hermes/memory
          echo "⏭️  init_db.py 跳过 — Memory() class 自建库 (memory.py:298)"

      - name: Run tests with coverage
        run: |
          cd "$GITHUB_WORKSPACE"
          # [7/21 fix] PYTHONPATH 让 tests 能 import api/mnelo_client。
          # 之前从 ~/.hermes/memory 跑 tests/ 找不到 tests/ 目录。
          export MNELO_MEMORY_DIR="$HOME/.hermes/memory"
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/api"
          python -m pytest tests/ -q --timeout=30 \
            --cov=mcp_server --cov=memory --cov=embedder \
            --cov=entity_resolve --cov=validation --cov=auth \
            --cov=config --cov=mnelo_locale --cov=i18n_messages \
            --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── Stage 3: Security scan ──────────────────────────────────────────
  security:
    name: Security (bandit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install bandit
        run: pip install bandit==1.7.10

      - name: Run bandit
        # Skip rules:
        # B101: assert — tests use asserts deliberately.
        # B404: subprocess import — used in scripts/health_check.py for `ps`.
        # B603: subprocess call — subprocess is intentional for lsof/ps.
        # B608: hardcoded_sql_expressions — f-string is from a literal whitelist,
        #       not user input (e.g. `SELECT count(*) FROM {table}` where table
        #       is from a hardcoded `_ALLOWED_TABLES` list).
        # B110: try_except_pass — scripts/migrate_to_mnelo.py uses for vec0 dim
        #       mismatch fallback (intentional swallow + log to stderr).
        # B105: hardcoded_password_string — `AUTH_TOKEN_ENV = "MNEOLO_AUTH_TOKEN"`
        #       is an env var NAME, not a password (false positive).
        # B607: start_process_with_partial_path — `lsof`, `ps` are deliberately
        #       called via PATH (false positive; we don't hardcode /usr/bin).
        run: |
          bandit -r . -lll \
            --skip B101,B404,B603,B608,B110,B105,B607 \
            -x ./tests/*,./htmlcov/*,./.git/*

  # ─── Stage 4: Summary (after all jobs) ──────────────────────────────
  summary:
    name: CI summary
    runs-on: macos-latest
    needs: [lint, test, security]
    if: always()
    steps:
      - name: Check overall result
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "❌ CI failed — see job details above" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ All checks passed" >> $GITHUB_STEP_SUMMARY