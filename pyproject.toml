# [meta] project metadata — PEP 621. PyPI long_description 走 README.md (description-content-type="text/markdown").
# 设计依据: 主人 8/11 拍板 "Knowledge-graph memory layer that Mem0 charges for" 风格重写 meta,
# 跟 README hero 三行同源 (README hero = tagline + contrast vs Mem0 + 价格锚点).
[project]
name = "mnelo"
version = "1.6.0"  # [P0 2026-08-15] v1.5.0 → v1.6.0 (MINOR bump): E-2 FTS5 重启 non-trigger 模式实战 (commit 3ca1502) + 1 新 P1 (user_id filter 实战暴露). 实战 P1 #66-#81 + #91 全应用. P1 #81 SIGSEGV 彻底解决. 跟 README badge + CHANGELOG 顶版本同步 tool visibility (memory_remember auto_relate 参数拓展 — @entity_id / #tag mention 解析 + 自动 relation 、规则化不调 LLM 、不抢决策）. 主人 6/29 不抢决策 iron law. 跟 README badge "Latest release" + CHANGELOG 顶版本同步; bump 时三处一致
description = "Local-first knowledge-graph memory layer for AI agents — 4-way RRF recall, optional L2 maintenance, bilingual zero-LLM classifier, all in one SQLite file. Runs on a $10/year VPS with usearch f16."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["memory", "ai-agent", "mcp", "knowledge-graph", "sqlite", "local-first", "rrf"]
authors = [
    { name = "cure4u" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Typing :: Typed",
]

[tool.ruff]
# [8/10 v1.0.0] Bump target to Python 3.10 — usearch>=2.26 (vector search backend) only ships
# wheels for Python 3.10+. Python 3.9 and lower cannot install usearch and are no longer
# supported. See PR #6 / commit 6861a2d follow-up notes.
target-version = "py310"
line-length = 200  # [8/9] 中文 docstring 200 字内单行合理; 实测 mcp_server/memory/task_states 长行 121-201
extend-exclude = [
    ".git",
    "__pycache__",
    "htmlcov",
    ".pytest_cache",
    "build",
    "dist",
    "*.egg-info",
    # Skip reformatting legacy tests (would create massive diff unrelated to current change)
    "tests/test_round7_coverage.py",
]

[tool.ruff.lint]
# Default ruleset + pycodestyle warnings + isort + pyupgrade
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
# Pragmas we explicitly tolerate:
# E402: module-level imports not at top — mnelo uses lazy imports for
#       optional deps (mcp, sqlite_vec); ruff can't see they're intentional.
# UP006/UP035: typing.List/Dict → list/dict — safe at 3.10+ target.
# B905: zip() without strict= — pre-existing code (metrics/search_index/tests)
#       uses zip() in length-equal contexts (labelnames parallel, vec parallel);
#       safe to add strict=True in a follow-up refactor, out of scope here.
ignore = [
    "E402",  # module-level import not at top of file
    "B008",  # do not perform function call in argument defaults (fastembed API)
    "B904",  # raise without from inside except (we re-raise deliberately)
    "B905",  # zip() without explicit strict= (pre-existing; refactor follow-up)
]

[tool.ruff.lint.per-file-ignores]
# Tests often have unused fixtures, intentional asserts, debug vars, etc.
"tests/*" = [
    "F401",  # unused imports in tests are often re-exports
    "F811",  # redefinition of unused name (parametrized fixtures)
    "F841",  # local variable assigned but never used (test debug helpers)
    "F541",  # f-string without placeholders (used as visual markers in tests)
    "I001",  # import sort order (some tests use unusual imports on purpose)
    "W292",  # trailing newline at EOF (cosmetic in test files)
    "E501",  # line too long (test descriptions + paths can exceed 120)
    "W291",  # trailing whitespace (test data with trailing spaces)
    "B007",  # unused loop variable (intentional in some fixtures)
]
# [8/15 E-A + E-B + E-C.2] mcp_tool_definitions.py 大量 JSON schema 字面量,
# "false"/"true"/"null" 是 JSON boolean/null (不是 Python) → ruff F821 误报
# description 文本常含中文 + URL 会超 200 字符 → E501 误报 (同 docs/DESIGN.md)
"mcp_tool_definitions.py" = ["F821", "E501"]
# [8/29 P4] api/mnelo_client.py uses `if x: dict['key'] = x` one-liner idiom
# for concise args-builder pattern. The PEP8 violation (E701 multi-statement
# on one line) is the intentional idiom throughout — refactoring to multi-line
# would harm readability. Allow E701 file-wide.
"api/mnelo_client.py" = ["E701"]

[tool.ruff.format]
# Match Black defaults so ruff format == black format (for back-compat)
quote-style = "double"
indent-style = "space"
line-ending = "auto"